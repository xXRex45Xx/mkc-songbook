name: Backend CI/CD

# Frontend is built and deployed by Cloudflare Pages; this workflow is backend only.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/xxrex45xx/mkc-songbook-backend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    # Images are built only for main; pull requests stop after tests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Runs on the self-hosted runner installed on home-server-1 (outbound-only,
    # so no inbound port or SSH through the tunnel). Never trigger it from pull_request.
    runs-on: [self-hosted, home-server-1]
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /opt/mkc
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install compose file
        run: |
          mkdir -p "$APP_DIR/uploads"
          cp deploy/docker-compose.yml "$APP_DIR/docker-compose.yml"

      - name: Deploy new image
        working-directory: /opt/mkc
        env:
          NEW_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          prev_tag=""
          if [ -f .env ]; then prev_tag="$(sed -n 's/^IMAGE_TAG=//p' .env)"; fi
          echo "IMAGE_TAG=$NEW_TAG" > .env
          docker compose pull backend
          if docker compose up -d --wait --wait-timeout 90 backend; then
            echo "Deployed $NEW_TAG"
          else
            echo "::error::Health check failed for $NEW_TAG"
            docker compose logs --tail 80 backend || true
            if [ -n "$prev_tag" ]; then
              echo "Rolling back to $prev_tag"
              echo "IMAGE_TAG=$prev_tag" > .env
              docker compose up -d --wait --wait-timeout 90 backend
            fi
            exit 1
          fi

      - name: Prune old images
        if: success()
        run: docker image prune -af --filter "until=168h"
